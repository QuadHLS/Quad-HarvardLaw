<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">QuadHLS source architecture overview</title>
  <desc id="desc">A source-derived overview showing a React and TypeScript browser client connected to Supabase services, with Vercel deployment configuration and access-boundary notes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">QuadHLS source architecture</text>
  <text x="60" y="96" font-family="Arial, sans-serif" font-size="16" fill="#475569">Repository overview derived from checked-in source; not proof of the currently deployed commit.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="320" height="220" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="88" y="192" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Browser client</text>
    <text x="88" y="230" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">React 18 + TypeScript</text>
    <text x="88" y="260" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Vite + TanStack Query</text>
    <text x="88" y="290" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Radix UI components</text>
    <text x="88" y="332" font-family="Arial, sans-serif" font-size="15" fill="#475569">Authentication-gated product flows</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="440" y="130" width="360" height="260" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <text x="472" y="172" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">Supabase services</text>
    <text x="472" y="212" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Auth and account state</text>
    <text x="472" y="242" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">PostgreSQL data and functions</text>
    <text x="472" y="272" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Realtime subscriptions</text>
    <text x="472" y="302" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Private Storage and signed URLs</text>
    <text x="472" y="332" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Edge Functions</text>
    <text x="472" y="366" font-family="Arial, sans-serif" font-size="14" fill="#475569">Source-level mechanisms; security review remains separate</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="150" width="280" height="220" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <text x="892" y="192" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#5b21b6">Vercel config</text>
    <text x="892" y="230" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">SPA routing</text>
    <text x="892" y="260" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Serverless API rules</text>
    <text x="892" y="304" font-family="Arial, sans-serif" font-size="15" fill="#475569">Deployment identity and</text>
    <text x="892" y="328" font-family="Arial, sans-serif" font-size="15" fill="#475569">current hosted state unknown</text>
  </g>

  <line x1="380" y1="260" x2="440" y2="260" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="800" y1="260" x2="860" y2="260" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="60" y="450" width="1080" height="150" rx="18" fill="#0f172a"/>
  <text x="92" y="490" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">Important boundary</text>
  <text x="92" y="526" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1">This diagram describes implementation mechanisms visible in the repository.</text>
  <text x="92" y="554" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1">It does not certify security, privacy, scalability, hosted-schema parity, or deployment success.</text>
  <text x="92" y="582" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1">No private user data or third-party screenshots are included.</text>
</svg>
